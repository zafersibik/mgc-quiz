<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F33">
<title>MGC Quiz</title>

<style>
:root{
  --ink:#0B1F33; --ink2:#14304D; --ink3:#1F466B;
  --paper:#F2F5F8; --card:#FFFFFF; --line:#D5DDE6;
  --text:#10243A; --muted:#5B6E82;
  --lens:#3FD0C3; --lens-d:#0B7F77;
  --c0:#E2483D; --c1:#2D6BE4; --c2:#F2A81D; --c3:#27A06B;
  font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--text);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body.dark{background:var(--ink);color:#fff}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lens);outline-offset:2px}
.screen{min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}

/* düğmeler */
.btn{font-weight:600;border:0;border-radius:10px;padding:.7em 1.15em;cursor:pointer;background:var(--ink);color:#fff;line-height:1.2}
.btn:hover{background:var(--ink2)}
.btn.primary{background:var(--lens-d);color:#fff}
.btn.primary:hover{background:#09685f}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.ghost:hover{background:#E6ECF2}
.btn.danger{background:#B3261E;color:#fff}
.btn.big{font-size:1.25rem;padding:.85em 1.6em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dark .btn.primary{background:var(--lens);color:var(--ink)}
.dark .btn.primary:hover{background:#6fe0d5}
.dark .btn.ghost{color:#fff;border-color:rgba(255,255,255,.32)}
.dark .btn.ghost:hover{background:rgba(255,255,255,.08)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.muted{color:var(--muted)}
.dark .muted{color:#9FB4C9}

/* marka */
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}

/* ---------- yönetici: soru hazırlama ---------- */
.editor{max-width:980px;margin:0 auto;padding-bottom:110px}
.ed-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:4px 0 22px}
.sec{margin-bottom:38px}
.sec + .sec{border-top:2px solid var(--line);padding-top:28px}
.sec-h{font-size:1.7rem;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.sec-p{margin-bottom:16px}
.settings .card{background:#E6F4F2;border-color:#A9D8D3}
.ed-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:10px 0 20px;flex-wrap:wrap}
.ed-head h1{font-size:2rem;font-weight:700;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.banner{background:#E4F7F5;border:1px solid #9ADBD5;border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.settings{display:grid;gap:14px;margin-bottom:14px}
.group h3{font-size:1.05rem;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint{font-size:.88rem;color:var(--muted);margin-top:10px}
input[type=range]{accent-color:var(--lens-d);width:min(220px,100%)}
.field label.lbl{display:block;font-size:.88rem;font-weight:600;margin-bottom:5px;color:var(--muted)}
.in{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:.6em .75em;background:#fff;color:var(--text)}
.in:focus{border-color:var(--lens-d);outline:none;box-shadow:0 0 0 3px rgba(63,208,195,.35)}
textarea.in{resize:vertical;min-height:64px}
.in.sm{max-width:130px}
.checks{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-top:12px}
.checks label{display:flex;gap:8px;align-items:center;cursor:pointer}
.toolbar{margin:0 0 18px}
.qcard{margin-bottom:16px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qnum{background:var(--ink);color:#fff;border-radius:8px;min-width:34px;height:34px;display:grid;place-items:center;font-weight:700}
.qhead .sp{flex:1}
.iconbtn{border:1.5px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:1rem;line-height:1}
.iconbtn:hover{background:#E6ECF2}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.opt-row{display:flex;align-items:center;gap:8px}
.opt-row .correct{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:.9rem;cursor:pointer}
.dot{display:inline-grid;place-items:center;border-radius:50%;font-weight:800;color:#fff;flex:none;line-height:1;border:0;padding:0}
.dot.sm{width:30px;height:30px;font-size:15px}
.dot.md{width:42px;height:42px;font-size:20px}
.dot.lg{width:clamp(38px,3.8vw,58px);height:clamp(38px,3.8vw,58px);font-size:clamp(20px,2vw,30px)}
.dot.pl{width:64px;height:64px;font-size:30px}
.dot.xl{width:min(28vw,96px);height:min(28vw,96px);font-size:2.2rem}
.d0{background:var(--c0)} .d1{background:var(--c1)} .d2{background:var(--c2);color:var(--ink)} .d3{background:var(--c3)}
.qmeta{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.thumb{height:46px;border-radius:8px;border:1px solid var(--line)}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px max(18px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.bottombar .inner{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- oyun ekranları (koyu) ---------- */
.lobby{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:start;padding-top:20px}
.qrbox{background:#fff;border-radius:18px;padding:18px;width:max-content}
.qrbox img,.qrbox canvas{display:block}
.pin{font-size:clamp(3rem,8vw,6rem);font-weight:800;letter-spacing:.08em;line-height:1;font-variant-numeric:tabular-nums}
.joinurl{font-size:1.15rem;word-break:break-all;color:#9FB4C9;margin:10px 0 24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 24px;max-height:36vh;overflow:auto}
.chip{background:var(--ink2);border:1px solid var(--ink3);border-radius:999px;padding:.35em .9em;font-weight:600;display:flex;gap:8px;align-items:center}
.chip button{background:none;border:0;color:#9FB4C9;cursor:pointer;font-size:1rem;padding:0 2px}
.chip button:hover{color:#fff}
.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:10px}
.pill{background:var(--ink2);border-radius:999px;padding:.4em 1em;font-weight:600}
.qtext{font-size:clamp(1.7rem,4.2vw,3.6rem);font-weight:700;line-height:1.15;letter-spacing:-.015em;max-width:1400px;margin:14px auto 18px;text-align:center}
.qimg{display:block;margin:0 auto 18px;max-width:min(70vw,900px);max-height:34vh;border-radius:14px;object-fit:contain;background:#fff}
.ring{position:relative;width:clamp(76px,9vw,120px);height:clamp(76px,9vw,120px);flex:none}
.ring svg{width:100%;height:100%}
.ring .rt{fill:none;stroke:var(--ink2);stroke-width:10}
.ring .rf{fill:none;stroke:var(--lens);stroke-width:10;stroke-linecap:round}
.ring .rn{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:clamp(1.6rem,3.2vw,2.8rem)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1400px;margin:0 auto}
.tile{border-radius:16px;padding:clamp(14px,2.2vw,28px);display:flex;align-items:center;gap:16px;font-size:clamp(1.15rem,2.6vw,2.2rem);font-weight:700;min-height:clamp(84px,15vh,170px);position:relative;color:#fff;line-height:1.2}
.tile .dot{background:#fff;color:var(--ink)}
.tile .cnt{margin-left:auto;font-size:1.3em;font-weight:800;padding-left:12px}
.t0{background:var(--c0)} .t1{background:var(--c1)} .t2{background:var(--c2);color:var(--ink)} .t3{background:var(--c3)}
.tile.dim{opacity:.25}
.tile.ok{outline:6px solid #fff;outline-offset:2px}
.tile.ok::after{content:"✓";position:absolute;right:-10px;top:-14px;background:#fff;color:var(--ink);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;font-weight:800}
.revgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;max-width:1500px;margin:0 auto;align-items:start}
.revgrid .tiles{grid-template-columns:1fr 1fr;margin:0}
.board{background:var(--ink2);border-radius:16px;padding:18px 20px}
.board h2{font-size:1.3rem;margin-bottom:10px}
.brow{display:flex;align-items:center;gap:12px;padding:.55em 0;border-bottom:1px solid var(--ink3);font-size:1.2rem}
.brow:last-child{border-bottom:0}
.brow .rk{width:2ch;font-weight:800;color:var(--lens)}
.brow .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .sc{font-variant-numeric:tabular-nums;font-weight:700}
.brow .gn{color:#7EE2B0;font-size:.9rem;min-width:5ch;text-align:right}
.actions{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.center{display:grid;place-items:center;text-align:center;min-height:70vh;gap:14px;align-content:center}
.center h2{font-size:clamp(1.6rem,4vw,3rem);font-weight:700}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;height:min(46vh,380px);max-width:900px;margin:20px auto 26px}
.pcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;min-width:0}
.pcol .pn{font-weight:700;font-size:clamp(1rem,2.2vw,1.8rem);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcol .ps{color:#9FB4C9;font-weight:600}
.pcol .bar{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:10px;font-size:2.4rem;font-weight:800;color:var(--ink)}
.pcol.p1 .bar{height:100%;background:var(--lens)}
.pcol.p2 .bar{height:72%;background:#BFD0E0}
.pcol.p3 .bar{height:52%;background:#E4B98A}
.fulllist{max-width:760px;margin:0 auto;background:var(--ink2);border-radius:16px;padding:10px 20px}

/* ---------- oyuncu (telefon) ---------- */
.pwrap{max-width:520px;margin:0 auto}
.joinform{display:grid;gap:14px;margin-top:28px}
.joinform .in{background:var(--ink2);border-color:var(--ink3);color:#fff;font-size:1.2rem;padding:.8em .9em}
.joinform .in::placeholder{color:#7F95AB}
.err{color:#FFB4AB;min-height:1.4em}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ptop .ring{width:64px;height:64px}
.ptop .ring .rn{font-size:1.5rem}
.ptext-q{font-size:1.15rem;font-weight:600;margin-bottom:12px}
.prows{display:grid;gap:10px}
.prow{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 14px;border-radius:14px;background:var(--ink2);border:1.5px solid var(--ink3);color:#fff;cursor:pointer;text-align:left;font-weight:600;font-size:1.05rem;line-height:1.25}
.prow:active{background:var(--ink3)}
.prow .ptxt{flex:1;word-break:break-word}
.pdots{display:grid;grid-template-columns:1fr 1fr;gap:20px;justify-items:center;margin:26px 0}
.pbtn{cursor:pointer}
.pbtn:active{transform:scale(.94)}
.hintq{text-align:center;color:#9FB4C9;margin-top:24px}
.arow{margin-top:14px}
.arow .lbl{font-size:.9rem;color:#9FB4C9;margin-bottom:6px}
.ans{display:flex;align-items:center;gap:12px;background:var(--ink2);border-radius:14px;padding:10px 14px;font-weight:600;line-height:1.25}
.result{border-radius:22px;padding:34px 20px;margin:24px 0 18px;text-align:center}
.result.good{background:#1E7A52}
.result.bad{background:#A8342C}
.result.none{background:var(--ink3)}
.result h2{font-size:2.4rem;font-weight:800}
.result p{font-size:1.4rem;margin-top:6px;font-weight:600}
.stats{display:flex;gap:12px;justify-content:center}
.stat{background:var(--ink2);border-radius:14px;padding:14px 20px;text-align:center;min-width:130px}
.stat b{display:block;font-size:1.8rem}

/* cevap durumu, kayıtlı sınavlar */
.statusrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1400px;margin:16px auto 0}
.nchip{background:var(--ink2);color:#9FB4C9;border:1px solid var(--ink3);border-radius:999px;padding:.2em .85em;font-size:.95rem;font-weight:600}
.nchip.done{background:var(--lens);color:var(--ink);border-color:var(--lens)}
.nonans{background:var(--ink2);border-radius:16px;padding:14px 20px;margin-top:14px}
.nonans h3{font-size:1.05rem;margin-bottom:6px}
.nonans p{color:#C7D6E5;line-height:1.4}
.libitem{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.libname{display:grid;gap:2px}
.modal h3{font-size:1.05rem}

/* hazırlık, değerlendirme, podyum açılışı */
.prepnum{font-size:clamp(7rem,26vw,20rem);font-weight:800;line-height:1;color:var(--lens);font-variant-numeric:tabular-nums}
.prepnum.go{color:#fff;font-size:clamp(4rem,15vw,12rem)}
.pwrap .prepnum{font-size:clamp(5rem,38vw,10rem)}
.pwrap .prepnum.go{font-size:clamp(3rem,20vw,6rem)}
.tallyring{width:clamp(110px,16vw,190px);height:clamp(110px,16vw,190px);border-radius:50%;border:10px solid var(--ink3);border-top-color:var(--lens);animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.autolbl{font-weight:600;color:#9FB4C9;align-self:center}
.hid{visibility:hidden}
.pcol.show{visibility:visible;animation:rise .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}

/* modal ve bildirim */
.ov{position:fixed;inset:0;background:rgba(11,31,51,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:#fff;color:var(--text);border-radius:16px;padding:22px;width:min(640px,100%);max-height:90dvh;overflow:auto;display:grid;gap:14px}
.modal h2{font-size:1.35rem}
.modal ul{margin:0;padding-left:1.2em}
.modal textarea{min-height:260px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#10243A;color:#fff;padding:.8em 1.2em;border-radius:12px;z-index:60;max-width:min(560px,92vw);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.fatal{max-width:560px;margin:12vh auto;padding:0 20px}
.fatal h1{margin-bottom:12px}

@media (max-width:820px){
  .grid3,.grid2{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .lobby{grid-template-columns:1fr;gap:24px}
  .revgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const LETTERS = 'ABCD';
function scoreFor(points, time, elapsedMs, bonus) {
  if (!bonus) return points;
  const total = time * 1000;
  const e = Math.min(Math.max(elapsedMs, 0), total);
  return Math.round(points * (1 - 0.5 * (e / total)));
}
function parseLetter(x) {
  const s = String(x == null ? '' : x).trim();
  if (/^[A-Da-d]$/.test(s)) return s.toUpperCase().charCodeAt(0) - 65;
  if (/^[1-4]$/.test(s)) return Number(s) - 1;
  return null;
}
function toNum(x) {
  if (x === '' || x == null) return null;
  const n = Number(String(x).replace(',', '.'));
  return Number.isFinite(n) && n >= 0 ? n : null;
}
function clampTime(t) { return t == null ? null : Math.max(5, Math.min(300, Math.round(t))); }
function newId() { return Math.random().toString(36).slice(2, 9); }
function newQ() { return { id: newId(), text: '', opts: ['', '', '', ''], correct: null, time: null, points: null, img: null }; }
function isBlank(q) { return !q.text.trim() && q.opts.every(o => !o.trim()) && !q.img; }
function rowsToQuestions(rows) {
  const out = [];
  rows.forEach((r, idx) => {
    const cells = r.map(c => (c == null ? '' : String(c).trim()));
    if (cells.every(c => !c)) return;
    if (idx === 0 && /soru/i.test(cells[0]) && /şık|sik|^a$/i.test(cells[1] || '')) return;
    if (/^örnek soru/i.test(cells[0])) return;
    const q = newQ();
    q.text = cells[0] || '';
    q.opts = [cells[1] || '', cells[2] || '', cells[3] || '', cells[4] || ''];
    q.correct = parseLetter(cells[5]);
    q.time = clampTime(toNum(cells[6]));
    q.points = toNum(cells[7]);
    out.push(q);
  });
  return out;
}
function parseText(txt) {
  const blocks = String(txt || '').replace(/\r/g, '').split(/\n\s*\n/);
  const out = [];
  blocks.forEach(b => {
    const lines = b.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) return;
    const q = newQ();
    const textLines = [];
    lines.forEach(l => {
      let m;
      if ((m = l.match(/^([A-Da-d])\s*[\)\.\:\-]\s*(.*)$/))) { q.opts[m[1].toUpperCase().charCodeAt(0) - 65] = m[2].trim(); }
      else if ((m = l.match(/^(doğru|dogru|cevap)(?:\s*şık)?\s*[:\-=]\s*([A-Da-d1-4])/i))) { q.correct = parseLetter(m[2]); }
      else if ((m = l.match(/^süre\s*[:\-=]\s*(\d+)/i))) { q.time = clampTime(Number(m[1])); }
      else if ((m = l.match(/^puan\s*[:\-=]\s*(\d+)/i))) { q.points = Number(m[1]); }
      else if (!q.opts.some(o => o) ) { textLines.push(l); }
    });
    q.text = textLines.join(' ').replace(/^\s*\d+\s*[\.\)]\s*/, '').trim();
    if (q.text || q.opts.some(o => o)) out.push(q);
  });
  return out;
}
function sortBoard(board) {
  return Object.entries(board || {}).map(([uid, v]) => ({ uid, ...v }))
    .sort((a, b) => b.s - a.s || String(a.n).localeCompare(String(b.n), 'tr'));
}
function rankOf(sorted, uid) {
  const me = sorted.find(x => x.uid === uid);
  if (!me) return null;
  return 1 + sorted.filter(x => x.s > me.s).length;
}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (['value', 'checked', 'disabled'].includes(k)) el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = (c) => {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(add);
    else el.append(c.nodeType ? c : document.createTextNode(String(c)));
  };
  kids.forEach(add);
  return el;
}

let AC = null, ACTIVE = [];
function audio() {
  try {
    if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
    if (AC && AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
  return AC;
}
function tone(freq, dur, o = {}) {
  if (!D.meta.sound) return;
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + (o.when || 0);
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = o.type || 'sine'; osc.frequency.value = freq;
  const peak = Math.max(0.0002, 0.3 * (o.vol == null ? 1 : o.vol) * D.meta.volume);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(ac.destination);
  osc.start(t); osc.stop(t + dur + 0.03);
  ACTIVE.push(osc);
  osc.onended = () => { ACTIVE = ACTIVE.filter(x => x !== osc); };
}
function silence() { ACTIVE.forEach(o => { try { o.stop(); } catch (e) {} }); ACTIVE = []; }

function ringNode(total) {

  const wrap = h('div', { class: 'ring', html: `<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="rt" cx="60" cy="60" r="54"/><circle class="rf" cx="60" cy="60" r="54" stroke-dasharray="${c}" stroke-dashoffset="0" transform="rotate(-90 60 60)"/></svg>` });

function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let maxSide = 900, quality = 0.72, out = '';
      for (let tries = 0; tries < 4; tries++) {
        const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', quality);
        if (out.length < 160000) break;
        maxSide = Math.round(maxSide * 0.8); quality = Math.max(0.45, quality - 0.1);
      }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}

async function importExcel(file) {
  if (!window.XLSX) { toast('Excel kitaplığı yüklenemedi. İnternet bağlantısını kontrol et.'); return; }
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

/* ---------- oyun yönetimi ---------- */
async function attachHost(pin) {
  detachAll();
  mount(h('div', { class: 'center muted' }, 'Oyun yükleniyor…'));
  document.body.className = 'dark';
  let metaS, qS;
  try {
    [metaS, qS] = await Promise.all([get(ref(db, `games/${pin}/meta`)), get(ref(db, `games/${pin}/hostOnly/questions`))]);
  } catch (e) { toast('Oyun yüklenemedi: ' + (e.message || e.code)); renderEditor(false); return; }
  const raw = qS.val();
  if (!metaS.exists() || !raw) { toast('Oyun verisi bulunamadı.'); localStorage.removeItem('mgcPin'); RESUME = null; renderEditor(false); return; }
  const questions = Object.keys(raw).sort((a, b) => Number(a.slice(1)) - Number(b.slice(1))).map(k => {
    const r = raw[k];
    return { text: r.text, opts: Array.isArray(r.opts) ? r.opts : Object.values(r.opts), correct: r.correct, time: r.time, points: r.points, img: r.img || null };
  });
  H = { pin, meta: metaS.val(), questions, players: {}, answers: {}, qlog: {}, board: null, state: null, revealing: false, key: '' };
  const p = (path, fn) => UNS.push(onValue(ref(db, `games/${pin}/${path}`), fn));
  p('players', s => { H.players = s.val() || {}; onPlayersChange(); });
  p('answers', s => { H.answers = s.val() || {}; onAnswersChange(); });
  p('qlog', s => { H.qlog = s.val() || {}; });
  p('board', s => { H.board = s.val(); });
  p('state', s => { H.state = s.val(); renderHost(); });
}

function renderHost(force) {
  if (!H || !H.state || !H.meta) return;
  const st = H.state;
  const key = [st.status, st.index, st.revealed].join(':');
  if (!force && key === H.key) return;
  H.key = key;
  H.advancing = false;
  clearInterval(TICK); clearTO();
  document.body.className = 'dark';
  if (st.status === 'lobby') hostLobby();
  else if (st.status === 'prep') hostPrep();
  else if (st.status === 'question') hostQuestion();
  else if (st.status === 'reveal') hostReveal();
  else if (st.status === 'tally') hostTally();
  else if (st.status === 'final') hostFinal();
}

async function openQuestion(i) {

async function startQuestion(i) {

    await update(ref(db, `games/${H.pin}`), {
      current: cur,

function hostPrep() {
  const st = H.state, i = st.index, sec = st.prepSec || 3;
  const num = h('div', { class: 'prepnum', 'aria-live': 'polite' }, String(sec));
  mount(h('div', { class: 'screen' },

    h('div', { class: 'center' }, h('p', { class: 'muted', style: 'font-size:1.6rem' }, 'Hazır ol'), num),
    h('div', { class: 'actions' }, soundBtn())));

  startTick(() => {
    const s = H.state; if (!s || s.status !== 'prep') return;

      if (n !== last) { last = n; num.textContent = String(n); SND.prep(); }

function hostQuestion() {
  const i = H.state.index, q = H.questions[i];
  const r = ringNode(q.time);
  mount(h('div', { class: 'screen' },
    h('div', { class: 'topline' },
      h('span', { class: 'pill' }, `Soru ${i + 1} / ${H.questions.length}`),

      h('button', { class: 'btn ghost', onClick: () => reveal(false) }, 'Soruyu şimdi bitir'),
      soundBtn())));
  updateCounter();
  let lastSec = null, ended = false;
  startTick(() => {
    const st = H.state; if (!st || st.status !== 'question') return;

    const rem = st.startedAt ? st.startedAt + total - srvNow() : total;
    r.update(rem, total);
    const s = Math.ceil(rem / 1000);
    if (s !== lastSec) {
      lastSec = s;
      if (s > 5 && s <= 10) SND.tick();
      else if (s > 0 && s <= 5) SND.beep();
    }
    if (rem <= 0 && !ended) { ended = true; SND.end(); reveal(true); }
  });
}

/* ---------- puanlama ---------- */
function detail(i, uid) {
  const q = H.questions[i];
  const a = (H.answers['q' + i] || {})[uid];
  const start = (H.qlog['q' + i] || {}).startedAt;
  if (!a) return { choice: -1, gain: 0, ok: false };
  const ok = a.c === q.correct;
  const elapsed = start ? a.t - start : q.time * 500;
  return { choice: a.c, ok, gain: ok ? scoreFor(q.points, q.time, elapsed, H.meta.bonus) : 0 };
}
function computeBoard(upTo) {
  const board = {};
  Object.entries(H.players).forEach(([uid, p]) => { board[uid] = { n: p.name, s: 0, l: 0, c: 0, ok: false, a: -1 }; });
  for (let i = 0; i <= upTo; i++) {
    for (const uid in board) {
      const d = detail(i, uid);
      board[uid].s += d.gain;
      if (d.ok) board[uid].c++;
      if (i === upTo) { board[uid].l = d.gain; board[uid].ok = d.ok; board[uid].a = d.choice; }
    }
  }
  return board;
}

async function reveal(timeUp) {
  if (!H || H.revealing || !H.state || H.state.status !== 'question') return;
  H.revealing = true; clearInterval(TICK);
  if (!timeUp) silence();
  const i = H.state.index;
  try {
    await update(ref(db, `games/${H.pin}/state`), { status: 'reveal' });
    const base = `games/${H.pin}`;
    const [a, pl, ql] = await Promise.all([get(ref(db, base + '/answers')), get(ref(db, base + '/players')), get(ref(db, base + '/qlog'))]);
    H.answers = a.val() || {}; H.players = pl.val() || {}; H.qlog = ql.val() || {};
    const board = computeBoard(i);
    H.board = board;
    await update(ref(db, base), { board, 'current/correct': H.questions[i].correct, 'state/revealed': i });
  } catch (e) { toast('Sonuçlar yazılamadı: ' + (e.message || e.code)); }
  H.revealing = false;
}

function boardRows(sorted, limit, showGain) {
  return sorted.slice(0, limit).map((r) => h('div', { class: 'brow' },
    h('span', { class: 'rk' }, String(rankOf(sorted, r.uid))), h('span', { class: 'nm' }, r.n),
    showGain && r.l ? h('span', { class: 'gn' }, '+' + r.l) : h('span', { class: 'gn' }), h('span', { class: 'sc' }, String(r.s))));
}

function pauseBtnFor(lbl, textFn) {
  const b = h('button', { class: 'btn ghost', onClick: () => { H.paused = !H.paused; b.textContent = H.paused ? 'Devam et' : 'Duraklat'; lbl.textContent = textFn(); } }, H.paused ? 'Devam et' : 'Duraklat');
  return b;
}

function hostReveal() {
  const i = H.state.index, q = H.questions[i];
  if (H.state.revealed !== i || !H.board) {
    mount(h('div', { class: 'screen' }, h('div', { class: 'center' }, h('h2', {}, 'Cevaplar sayılıyor…'))));
    return;
  }
  const counts = [0, 0, 0, 0];
  Object.values(H.answers['q' + i] || {}).forEach(a => { if (a.c >= 0 && a.c <= 3) counts[a.c]++; });
  const sorted = sortBoard(H.board);
  const last = i >= H.questions.length - 1;
  const goNext = () => {
    if (H.advancing) return; H.advancing = true; H.paused = false; clearInterval(TICK);
    if (last) update(ref(db, `games/${H.pin}/state`), { status: 'tally', tallyAt: serverTimestamp() }).catch(() => toast('Geçiş yapılamadı.'));
    else openQuestion(i + 1);
  };
  const auto = !!H.meta.autoNext;
  const lbl = h('span', { class: 'autolbl' });
  H.autoLeft = (H.meta.autoSec || 10) * 1000;
  const text = () => H.paused ? 'Duraklatıldı' : `${last ? 'Sonuçlar' : 'Sonraki soru'} ${Math.ceil(H.autoLeft / 1000)} sn sonra`;
  const ansMap = H.answers['q' + i] || {};
  const missing = playerList().filter(p => !ansMap[p.uid]);
  const nonAnsNode = (H.meta.showWho !== false && missing.length) ? h('div', { class: 'nonans' },
    h('h3', {}, `Cevap vermeyenler (${missing.length})`),
    h('p', {}, missing.slice(0, 8).map(p => p.name).join(', ') + (missing.length > 8 ? ` ve ${missing.length - 8} kişi daha` : ''))) : null;
  const nextBtn = h('button', { class: 'btn primary big', onClick: goNext }, last ? 'Sonuçları göster' : 'Sonraki soru');
  mount(h('div', { class: 'screen' },
    h('div', { class: 'topline' }, h('span', { class: 'pill' }, `Soru ${i + 1} / ${H.questions.length}`), h('span', { class: 'pill' }, `${Object.keys(H.answers['q' + i] || {}).length} cevap`)),
    h('h1', { class: 'qtext', style: 'font-size:clamp(1.4rem,3vw,2.4rem)' }, q.text),
    h('div', { class: 'revgrid' },
      h('div', { class: 'tiles' }, [0, 1, 2, 3].map(k => h('div', { class: 'tile t' + k + (k === q.correct ? ' ok' : ' dim') }, dot(k, 'lg'), h('span', {}, q.opts[k]), h('span', { class: 'cnt' }, String(counts[k]))))),
      h('div', {}, h('div', { class: 'board' }, h('h2', {}, 'İlk 5'), boardRows(sorted, 5, true)), nonAnsNode)),
    h('div', { class: 'actions' }, auto ? [lbl, pauseBtnFor(lbl, text)] : null, nextBtn, soundBtn())));
  if (counts[q.correct] > 0) SND.chime();
  if (auto) {
    lbl.textContent = text();
    startTick(() => {
      if (!H.state || H.state.status !== 'reveal') return;
      if (!H.paused) H.autoLeft -= 100;
      lbl.textContent = text();
      if (H.autoLeft <= 0) goNext();
    });
  }
}

function toFinal() {
  if (H.advancing) return; H.advancing = true; H.paused = false; clearInterval(TICK);
  update(ref(db, `games/${H.pin}/state`), { status: 'final', podium: false }).catch(() => toast('Geçiş yapılamadı.'));
}

function hostTally() {
  const auto = !!H.meta.finalAuto;
  H.autoLeft = (H.meta.finalSec || 10) * 1000;
  const lbl = h('p', { class: 'autolbl' });
  const text = () => H.paused ? 'Duraklatıldı' : `Sonuçlar ${Math.ceil(H.autoLeft / 1000)} sn sonra açılıyor`;
  mount(h('div', { class: 'screen' }, h('div', { class: 'center' },
    h('div', { class: 'tallyring', role: 'img', 'aria-label': 'Bekleniyor' }),
    h('h2', {}, 'Cevaplar değerlendiriliyor…'),
    auto ? h('div', { class: 'row', style: 'justify-content:center' }, lbl, pauseBtnFor(lbl, text), h('button', { class: 'btn ghost', onClick: toFinal }, 'Şimdi aç'))
         : h('button', { class: 'btn primary big', onClick: toFinal }, 'Podyumu aç'),
    soundBtn())));
  let ticks = 0;
  startTick(() => {
    if (!H.state || H.state.status !== 'tally') return;
    if (!H.paused) {
      if (ticks % 10 === 0) SND.heart();
      ticks++;
      if (auto) H.autoLeft -= 100;
    }
    if (auto) { lbl.textContent = text(); if (H.autoLeft <= 0) toFinal(); }
  });
}

function hostFinal() {
  const sorted = sortBoard(H.board);
  const top = sorted.slice(0, 3);
  const col = (r, n) => r ? h('div', { class: 'pcol p' + n + ' hid' }, h('span', { class: 'pn' }, r.n), h('span', { class: 'ps' }, r.s + ' puan'), h('div', { class: 'bar' }, String(n))) : h('div', { class: 'pcol' });
  const cols = { 1: col(top[0], 1), 2: col(top[1], 2), 3: col(top[2], 3) };
  const after = h('div', { class: 'hid' },
    h('div', { class: 'fulllist' }, boardRows(sorted, 500, false)),
    h('div', { class: 'actions' },
      h('button', { class: 'btn primary', onClick: restartGame }, 'Aynı sorularla yeniden başlat'),
      h('button', { class: 'btn ghost', onClick: exportResults }, 'Sonuçları Excel olarak indir'),
      h('button', { class: 'btn ghost', onClick: async () => { if (!confirm('Oyun ve tüm cevaplar silinsin mi? Sonuçları indirdiğinden emin ol.')) return; const pin = H.pin; try { await remove(ref(db, `games/${pin}`)); } catch (e) {} leaveGame(); } }, 'Oyunu sil ve çık'),
      h('button', { class: 'btn ghost', onClick: leaveGame }, 'Yeni oyun hazırla'),
      soundBtn()));
  mount(h('div', { class: 'screen' },
    h('div', { class: 'center', style: 'min-height:auto;padding-top:10px' }, h('h2', {}, H.meta.title)),
    sorted.length ? h('div', { class: 'podium' }, cols[2], cols[1], cols[3]) : h('p', { class: 'center muted' }, 'Katılımcı yok.'),
    after));
  const donePodium = () => { after.classList.remove('hid'); update(ref(db, `games/${H.pin}/state`), { podium: true }).catch(() => {}); };
  const steps = [3, 2, 1].filter(n => top[n - 1]);
  if (!steps.length) { donePodium(); return; }
  let t = 900;
  steps.forEach((n, idx) => {
    later(() => { cols[n].classList.remove('hid'); cols[n].classList.add('show'); if (n === 1) SND.first(); else SND.place(n); }, t);
    t += idx < steps.length - 1 ? 2200 : 2000;
  });
  later(donePodium, t);
}

async function restartGame() {
  if (!confirm('Puanlar ve cevaplar silinecek. Sonuçları Excel olarak indirdin mi? Devam edilsin mi?')) return;
  try {
    const round = ((H.state && H.state.round) || 0) + 1;
    H.paused = false; H.board = null;
    await update(ref(db, `games/${H.pin}`), {
      answers: null, board: null, qlog: null, current: null,
      state: { status: 'lobby', index: -1, qkey: '', startedAt: 0, revealed: -1, podium: false, round }
    });
  } catch (e) { toast('Yeniden başlatılamadı: ' + (e.message || e.code)); }
}

function leaveGame() {
  detachAll();
  localStorage.removeItem('mgcPin'); RESUME = null; H = null;
  renderEditor(false);
}

function exportResults() {
  if (!window.XLSX) { toast('Excel kitaplığı yüklenemedi. İnternet bağlantısını kontrol et.'); return; }
  const sorted = sortBoard(H.board);
  const r1 = [['Sıra', 'Ad', 'Toplam puan', 'Doğru sayısı']];
  sorted.forEach(r => r1.push([rankOf(sorted, r.uid), r.n, r.s, r.c]));
  const head = ['Ad'];
  H.questions.forEach((q, i) => head.push(`S${i + 1} cevap`, `S${i + 1} puan`));
  const r2 = [head];
  sorted.forEach(r => {
    const row = [r.n];
    H.questions.forEach((q, i) => { const d = detail(i, r.uid); row.push(d.choice < 0 ? '-' : LETTERS[d.choice], d.gain); });
    r2.push(row);
  });
  const r3 = [['Soru no', 'Soru', 'Doğru şık', 'Doğru', 'Yanlış', 'Cevapsız']];
  H.questions.forEach((q, i) => {
    let ok = 0, bad = 0, none = 0;
    sorted.forEach(r => { const d = detail(i, r.uid); if (d.choice < 0) none++; else if (d.ok) ok++; else bad++; });
    r3.push([i + 1, q.text, LETTERS[q.correct], ok, bad, none]);
  });
  const wb = XLSX.utils.book_new();
  const s1 = XLSX.utils.aoa_to_sheet(r1); s1['!cols'] = [{ wch: 8 }, { wch: 30 }, { wch: 14 }, { wch: 14 }];
  const s2 = XLSX.utils.aoa_to_sheet(r2); s2['!cols'] = [{ wch: 30 }].concat(H.questions.flatMap(() => [{ wch: 11 }, { wch: 11 }]));
  const s3 = XLSX.utils.aoa_to_sheet(r3); s3['!cols'] = [{ wch: 9 }, { wch: 60 }, { wch: 11 }, { wch: 9 }, { wch: 9 }, { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, s1, 'Sıralama');
  XLSX.utils.book_append_sheet(wb, s2, 'Soru detayı');
  XLSX.utils.book_append_sheet(wb, s3, 'Soru analizi');
  const d = new Date(); const ds = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  XLSX.writeFile(wb, `MGC_Quiz_Sonuclari_${ds}.xlsx`);
}

/* =====================================================================
   KATILIMCI (telefon)
   ===================================================================== */
let P = null;

async function playerBoot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('mgcPlayer') || 'null'); } catch (e) {}
  if (saved && saved.pin && (!PIN_PARAM || PIN_PARAM === saved.pin)) {
    try {
      const [hs, me] = await Promise.all([get(ref(db, `games/${saved.pin}/hostUid`)), get(ref(db, `games/${saved.pin}/players/${UID}`))]);
      if (hs.exists() && me.exists()) { attachPlayer(saved.pin, me.val().name); return; }
    } catch (e) {}
    localStorage.removeItem('mgcPlayer');
  }
  renderJoin('');
}

function renderJoin(msg) {
  clearInterval(TICK);
  document.body.className = 'dark';
  const pinIn = h('input', { class: 'in', type: 'text', inputmode: 'numeric', pattern: '[0-9]*', maxlength: 6, placeholder: 'Oyun kodu', 'aria-label': 'Oyun kodu', value: PIN_PARAM });
  const nameIn = h('input', { class: 'in', type: 'text', maxlength: 24, placeholder: 'Adın veya takma adın', 'aria-label': 'Adın', autocomplete: 'nickname' });
  const err = h('p', { class: 'err', role: 'alert' }, msg);
  const btn = h('button', { class: 'btn primary big', onClick: join }, 'Katıl');
  async function join() {
    const pin = pinIn.value.replace(/\D/g, '');
    let name = nameIn.value.trim().replace(/\s+/g, ' ');
    if (pin.length !== 6) { err.textContent = 'Oyun kodu 6 haneli olmalı.'; return; }
    if (!name) { err.textContent = 'Bir ad yazman gerekiyor.'; return; }
    btn.disabled = true; err.textContent = '';
    try {
      const hs = await get(ref(db, `games/${pin}/hostUid`));
      if (!hs.exists()) { err.textContent = 'Bu kodla bir oyun bulunamadı. Kodu kontrol et.'; btn.disabled = false; return; }
      const mine = await get(ref(db, `games/${pin}/players/${UID}`));
      if (mine.exists()) name = mine.val().name;
      else {
        const all = (await get(ref(db, `games/${pin}/players`))).val() || {};
        const taken = new Set(Object.values(all).map(p => String(p.name).toLowerCase()));
        let finalName = name, n = 2;
        while (taken.has(finalName.toLowerCase())) { finalName = `${name.slice(0, 20)} ${n++}`; }
        name = finalName;
        await set(ref(db, `games/${pin}/players/${UID}`), { name, at: serverTimestamp() });
      }
      attachPlayer(pin, name);
    } catch (e) {
      err.textContent = 'Katılamadın. İnternet bağlantını kontrol edip tekrar dene.'; btn.disabled = false;
    }
  }
  [pinIn, nameIn].forEach(i => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); }));
  mount(h('div', { class: 'screen' }, h('div', { class: 'pwrap' }, brand(),
    h('div', { class: 'joinform' }, pinIn, nameIn, btn, err))));
}

async function attachPlayer(pin, name) {
  detachAll();
  localStorage.setItem('mgcPlayer', JSON.stringify({ pin, name }));
  P = { pin, name, meta: null, state: null, cur: null, board: null, answered: null, choice: -1, expired: null, failed: null, key: '' };
  mount(h('div', { class: 'screen' }, h('div', { class: 'center muted' }, 'Bağlanıyor…')));
  try {
    const s0 = (await get(ref(db, `games/${pin}/state`))).val();
    if (s0 && s0.status === 'question') {
      const a = await get(ref(db, `games/${pin}/answers/${s0.qkey}/${UID}`));
      if (a.exists()) { P.answered = qidOf(s0); P.choice = a.val().c; }
    }
  } catch (e) {}
  const p = (path, fn) => UNS.push(onValue(ref(db, `games/${pin}/${path}`), fn));
  p('meta', s => { P.meta = s.val(); renderPlayer(); });
  p('current', s => { P.cur = s.val(); renderPlayer(); });
  p('board', s => { P.board = s.val(); renderPlayer(); });
  p('state', s => { P.state = s.val(); renderPlayer(); });
  p('players/' + UID, s => { if (!s.exists() && P.state) { localStorage.removeItem('mgcPlayer'); detachAll(); renderJoin('Oyundan çıkarıldın. İstersen tekrar katılabilirsin.'); } });
}

const qidOf = (st) => (st.round || 0) + ':' + st.qkey;

function renderPlayer() {
  if (!P) return;
  const st = P.state, meta = P.meta;
  if (!st || !meta) return;
  const qid = qidOf(st), ans = P.answered === qid, exp = P.expired === qid, fail = P.failed === qid;
  const key = [st.round, st.status, st.index, st.revealed, st.podium, ans, exp, fail, P.board ? 1 : 0, P.cur ? (P.cur.correct == null ? 'n' : P.cur.correct) : 'x', P.cur ? P.cur.n : 0].join('|');
  if (key === P.key) return;
  P.key = key;
  clearInterval(TICK);
  document.body.className = 'dark';
  if (st.status === 'lobby') pWait('Hazırsın, ' + P.name, 'Oyun yakında başlayacak. Ekrana bak.');
  else if (st.status === 'prep') pPrep();
  else if (st.status === 'question') pQuestion(ans, exp, fail);
  else if (st.status === 'reveal') pReveal();
  else if (st.status === 'tally') pWait('Cevaplar değerlendiriliyor…', 'Sonuçlar ekranda açılacak.');
  else if (st.status === 'final') pFinal();
}

function pWait(title, sub, extra) {
  mount(h('div', { class: 'screen' }, h('div', { class: 'pwrap' }, h('div', { class: 'center' }, extra || null, h('h2', {}, title), sub ? h('p', { class: 'muted' }, sub) : null))));
}

function pPrep() {
  const st = P.state, sec = st.prepSec || 3;
  const num = h('div', { class: 'prepnum', 'aria-live': 'polite' }, String(sec));
  mount(h('div', { class: 'screen' }, h('div', { class: 'pwrap' }, h('div', { class: 'center' },
    h('p', { class: 'muted' }, `Soru ${st.index + 1} / ${P.meta.total}`), num, h('p', { class: 'muted' }, 'Hazır ol')))));
  startTick(() => {
    const s = P.state; if (!s || s.status !== 'prep') return;
    const rem = s.prepAt ? s.prepAt + sec * 1000 - srvNow() : sec * 1000;
    if (rem > 0) num.textContent = String(Math.ceil(rem / 1000));
    else { num.textContent = 'Başla!'; num.classList.add('go'); }
  });
}

function pQuestion(ans, exp, fail) {
  const cur = P.cur;
  if (!cur || cur.n !== P.state.index + 1) { pWait('Soru geliyor…', ''); return; }
  if (ans) {
    const big = dot(P.choice, 'pl');
    if (fail) pWait('Cevabın alınamadı', 'Süre dolmuş olabilir. Sıradaki soruya hazır ol.', big);
    else pWait('Cevabın alındı', 'Diğer katılımcılar bekleniyor…', big);
    return;
  }
  if (exp) { pWait('Süre doldu', 'Sonuç birazdan ekranda.'); return; }
  const r = ringNode(cur.time);
  const showText = P.meta.phoneText && cur.opts;
  const choices = showText
    ? h('div', { class: 'prows' }, [0, 1, 2, 3].map(k => h('button', { class: 'prow', 'aria-label': 'Şık ' + LETTERS[k], onClick: () => answer(k) }, dot(k, 'md'), h('span', { class: 'ptxt' }, cur.opts[k]))))
    : h('div', { class: 'pdots' }, [0, 1, 2, 3].map(k => h('button', { class: 'dot d' + k + ' xl pbtn', 'aria-label': 'Şık ' + LETTERS[k], onClick: () => answer(k) }, LETTERS[k])));
  mount(h('div', { class: 'screen' }, h('div', { class: 'pwrap' },
    h('div', { class: 'ptop' }, h('span', { class: 'pill' }, `Soru ${cur.n} / ${cur.total}`), r.wrap),
    showText && cur.text ? h('p', { class: 'ptext-q' }, cur.text) : null,
    showText ? null : h('p', { class: 'hintq' }, 'Ekrandaki soruya bak, cevabını seç.'),
    choices)));
  startTick(() => {
    const st = P.state; if (!st || st.status !== 'question') return;
    const total = cur.time * 1000;
    const rem = st.startedAt ? st.startedAt + total - srvNow() : total;
    r.update(rem, total);
    if (rem <= 0 && P.answered !== qidOf(st)) { P.expired = qidOf(st); renderPlayer(); }
  });
}

async function answer(c) {
  const st = P.state;
  if (!st || st.status !== 'question' || P.answered === qidOf(st)) return;
  const qkey = st.qkey, qid = qidOf(st);
  P.answered = qid; P.choice = c; renderPlayer();
  try { await set(ref(db, `games/${P.pin}/answers/${qkey}/${UID}`), { c, t: serverTimestamp() }); }
  catch (e) { P.failed = qid; renderPlayer(); }
}

function pReveal() {
  const st = P.state, cur = P.cur;
  if (st.revealed !== st.index || !cur || cur.correct == null) { pWait('Cevaplar sayılıyor…', ''); return; }
  const me = P.board && P.board[UID];
  if (!me) { pWait('Sıradaki soruya hazır ol', 'Bu soruya katılmadın.'); return; }
  const sorted = sortBoard(P.board);
  const rank = rankOf(sorted, UID);
  let box;
  if (me.a === -1) box = h('div', { class: 'result none' }, h('h2', {}, 'Cevap vermedin'), h('p', {}, '0 puan'));
  else if (me.ok) box = h('div', { class: 'result good' }, h('h2', {}, 'Doğru!'), h('p', {}, `+${me.l} puan`));
  else box = h('div', { class: 'result bad' }, h('h2', {}, 'Yanlış'), h('p', {}, '0 puan'));
  const opts = P.meta.phoneText && cur.opts ? cur.opts : null;
  const arow = (label, k) => h('div', { class: 'arow' }, h('div', { class: 'lbl' }, label),
    h('div', { class: 'ans' }, dot(k, 'md'), h('span', {}, opts ? opts[k] : 'Şık ' + LETTERS[k])));
  const extra = me.a === -1 ? [arow('Doğru cevap', cur.correct)] : me.ok ? [] : [arow('Senin cevabın', me.a), arow('Doğru cevap', cur.correct)];
  mount(h('div', { class: 'screen' }, h('div', { class: 'pwrap' }, box, extra,
    h('div', { class: 'stats' }, h('div', { class: 'stat' }, h('b', {}, `${rank}.`), 'Sıran'), h('div', { class: 'stat' }, h('b', {}, String(me.s)), 'Toplam puan')),
    h('p', { class: 'muted center', style: 'min-height:auto;margin-top:22px' }, 'Sıradaki soru bekleniyor…'))));
}

function pFinal() {
  if (!P.state.podium) { pWait('Sonuçlar ekranda!', 'Podyumu izle.'); return; }
  const me = P.board && P.board[UID];
  const sorted = sortBoard(P.board || {});
  const rank = rankOf(sorted, UID);
  mount(h('div', { class: 'screen' }, h('div', { class: 'pwrap' },
    h('div', { class: 'center', style: 'min-height:auto;padding:24px 0' }, h('h2', {}, 'Oyun bitti'),
      me ? h('div', { class: 'stats' }, h('div', { class: 'stat' }, h('b', {}, `${rank}.`), 'Sıran'), h('div', { class: 'stat' }, h('b', {}, String(me.s)), 'Toplam puan')) : null),
    h('div', { class: 'board' }, h('h2', {}, 'İlk 3'), boardRows(sorted, 3, false)),
    h('div', { class: 'actions' }, h('button', { class: 'btn ghost', onClick: () => { localStorage.removeItem('mgcPlayer'); detachAll(); P = null; renderJoin(''); } }, 'Yeni oyuna katıl')))));
}

boot();
</script>
